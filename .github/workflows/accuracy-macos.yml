name: Paired-reference accuracy on macOS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/accuracy-macos.yml', 'accuracy/benchmark_mac_turbo.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accuracy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: local-transcriber
          auto-activate-base: false
      - name: Acquire pinned public audio and model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python -u accuracy/prepare.py
          python -c "from huggingface_hub import snapshot_download; import os; snapshot_download(repo_id='dropbox-dash/faster-whisper-large-v3-turbo', revision='0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf', local_dir=os.environ['RUNNER_TEMP']+'/models/turbo', allow_patterns=['model.bin','config.json','tokenizer.json','preprocessor_config.json','vocabulary.*'])"
      - name: Compare actual CLI with known references on this Mac
        run: python -u accuracy/benchmark_mac_turbo.py --app transcribe.py --model "$RUNNER_TEMP/models/turbo" --results-dir mac-accuracy-results --threads 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-${{ matrix.os }}
          path: mac-accuracy-results/
          retention-days: 1
