name: Complete long French macOS validation
# Include model feature-extractor configuration for large-v3/turbo.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transcribe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: local-transcriber
          auto-activate-base: false
      - name: Prepare isolated media tool and run regression tests
        run: |
          conda install -n local-transcriber -c conda-forge ffmpeg -y
          mkdir -p ci-results
          uname -a > ci-results/platform.txt
          python -m pip freeze > ci-results/dependencies.txt
          python -m unittest discover -s tests -v 2>&1 | tee ci-results/unit-tests.txt
      - name: Download public model and public human-read audio
        run: |
          python transcribe.py download-model --size large-v3-turbo --directory "$RUNNER_TEMP/models/turbo"
          curl -fL --retry 2 --max-time 300 'https://archive.org/download/madame_bovary_neb_librivox/madamebovary_17_flaubert.mp3' -o "$RUNNER_TEMP/fr.mp3"
          ffmpeg -v error -i "$RUNNER_TEMP/fr.mp3" -c:a copy "$RUNNER_TEMP/fr.mkv"
      - name: Transcribe full French recording locally (Russian passed in prior run)
        run: |
          python -u tests/benchmark.py "$RUNNER_TEMP/fr.mkv" "$RUNNER_TEMP/models/turbo" fr ci-results/fr.txt ci-results/fr.json &
          transcription_pid=$!
          while kill -0 "$transcription_pid" 2>/dev/null; do
            tail -n 1 ci-results/fr.txt.log 2>/dev/null || true
            sleep 60
          done
          wait "$transcription_pid"
          test -s ci-results/fr.txt
          python tests/analyze_transcript.py ci-results/fr.txt 3159.85 > ci-results/fr-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: ci-results/
          retention-days: 1
